# Serveur de jeu FightForLigeria sur le VPS : projet Docker séparé de TTS.
# À placer dans /opt/fightforligeria/docker-compose.yml (voir deploy/README.md).
name: fightforligeria

services:
  game:
    image: ghcr.io/julian982/fightforligeria-server:latest
    container_name: ffl-game
    restart: unless-stopped
    environment:
      PORT: "2567"
    # aucun port publié sur internet : seul le Nginx de TTS le joint, par le réseau « ffl-proxy »
    expose:
      - "2567"
    networks:
      - ffl-proxy
    # garde-fous : il ne peut pas prendre les ressources de TTS
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # réseau partagé uniquement entre ce conteneur et le Nginx de TTS (créé une fois : docker network create ffl-proxy)
  ffl-proxy:
    external: true
