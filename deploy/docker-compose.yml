# Serveur de jeu FightForLigeria sur le VPS, derrière le Traefik commun (dépôt vps-infra).
# Projet Docker indépendant : il ne voit rien des autres projets (TTS, ...) et n'ouvre aucun port.
name: fightforligeria

services:
  game:
    image: ghcr.io/julian982/fightforligeria-server:latest
    container_name: ffl-game
    restart: unless-stopped
    environment:
      PORT: "2567"
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ffl.rule=Host(`fightforligeria.trouve-ton-serveur.fr`)
      - traefik.http.routers.ffl.middlewares=security-headers@file
      - traefik.http.services.ffl.loadbalancer.server.port=2567
    # limites : le jeu ne peut pas étouffer les autres projets du VPS
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    external: true # créé par vps-infra (scripts/bootstrap.sh)
