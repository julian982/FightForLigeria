# Serveur de jeu FightForLigeria sur le VPS : projet Docker séparé de TTS.
# Placé automatiquement dans /opt/fightforligeria/ par la GitHub Action (voir deploy/README.md).
name: fightforligeria

services:
  game:
    image: ghcr.io/julian982/fightforligeria-server:latest
    container_name: ffl-game
    restart: unless-stopped
    environment:
      PORT: "2567"
    # écoute seulement sur la machine elle-même : le Nginx de TTS (en réseau « host ») le joint sur 127.0.0.1:2567,
    # internet ne peut pas le joindre directement
    ports:
      - "127.0.0.1:2567:2567"
    # garde-fous : il ne peut pas prendre les ressources de TTS
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
# pas de réseau partagé : ce projet a son propre réseau Docker, sans accès à celui de TTS (tts-net, MariaDB…)
