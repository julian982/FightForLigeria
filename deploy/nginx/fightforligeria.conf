# FightForLigeria : serveur de jeu en ligne (WebSocket) derrière le Nginx de TTS.
# Fichier à part, monté dans /etc/nginx/conf.d/ à côté de default.conf (rien n'est modifié dans default.conf).
# Domaine : jeu.trouve-ton-serveur.fr (à remplacer partout si tu en choisis un autre).

map $http_upgrade $ffl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jeu.trouve-ton-serveur.fr;
    server_tokens off;

    # validation Let's Encrypt (même dossier que pour TTS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Ce bloc ne peut être activé qu'une fois le certificat obtenu (voir deploy/README.md, étape 4).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jeu.trouve-ton-serveur.fr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/jeu.trouve-ton-serveur.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeu.trouve-ton-serveur.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # le conteneur du jeu (si il est arrêté : erreur 502 sur ce sous-domaine seulement, TTS n'est pas touché)
        proxy_pass http://127.0.0.1:2567;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ffl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # une partie peut durer : on ne coupe pas les connexions trop vite
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
