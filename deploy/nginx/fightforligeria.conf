# FightForLigeria : à ajouter tel quel dans la configuration Nginx de TTS (un fichier à part, ne modifie rien d'existant).
# Remplace jeu.example.fr par ton sous-domaine (3 occurrences), et adapte les chemins des certificats à ton installation.

map $http_upgrade $ffl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name jeu.example.fr;

    # validation Let's Encrypt (même dossier que pour TTS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jeu.example.fr;

    ssl_certificate     /etc/letsencrypt/live/jeu.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeu.example.fr/privkey.pem;

    location / {
        # le conteneur du jeu, joint par le réseau « ffl-proxy »
        resolver 127.0.0.11 valid=30s;
        set $ffl_upstream http://ffl-game:2567;
        proxy_pass $ffl_upstream;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ffl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # une partie peut durer : on ne coupe pas les connexions inactives trop vite
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
