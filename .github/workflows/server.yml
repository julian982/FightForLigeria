name: Serveur de jeu (image Docker et déploiement sur le VPS)

on:
  push:
    branches: [main]
    paths: ['shared/**', 'server/**', 'package.json', 'package-lock.json', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fightforligeria-server

jobs:
  build:
    runs-on: ubuntu-latest
    # base jetable pour le test des comptes
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ffl_test
          MARIADB_USER: ffl
          MARIADB_PASSWORD: ffl
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de la simulation, du serveur et des comptes
        run: npm test && npm run test:server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: ffl
          DB_PASSWORD: ffl
          DB_NAME: ffl_test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Déploiement sur le VPS
        # ne se lance que si les secrets du VPS sont configurés (voir deploy/README.md)
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mkdir -p /opt/fightforligeria && cd /opt/fightforligeria
            # le compose suit toujours celui du dépôt
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/docker-compose.yml -o docker-compose.yml
            docker compose pull
            docker compose up -d
            docker image prune -f
